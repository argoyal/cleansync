name: CI
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # keep in sync with the Dockerfile ARG RCLONE_VERSION (not named RCLONE_VERSION: rclone reads that variable itself)
  RCLONE_PIN_VERSION: "1.75.1"
  # keep in sync with the Dockerfile ARG RCLONE_SHA256_AMD64
  RCLONE_PIN_SHA256_AMD64: "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Install poppler (PDF previews)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: uv run pytest -q -m "not realrclone"

  real-rclone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install pinned rclone
        run: |
          curl -fsSLo /tmp/rclone.zip "https://downloads.rclone.org/v${RCLONE_PIN_VERSION}/rclone-v${RCLONE_PIN_VERSION}-linux-amd64.zip"
          echo "${RCLONE_PIN_SHA256_AMD64}  /tmp/rclone.zip" | sha256sum -c -
          sudo unzip -j /tmp/rclone.zip "*/rclone" -d /usr/local/bin
          rclone version
      - run: uv sync --frozen
      - run: uv run pytest -q -m realrclone

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The image that ships, with real rclone, a local "pretend Google" account and a real browser.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cleansync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        # Pretend local accounts on (test only): the e2e test signs in to one without Google.
        run: |
          docker run -d --name cs -p 8080:8080 --read-only --tmpfs /tmp \
            --tmpfs /drivesync:uid=1000,gid=1000 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e PUBLIC_URL=http://localhost:8080 -e ADMIN_PASSWORD=ci-smoke-password \
            -e DRIVESYNC_ALLOW_LOCAL_ACCOUNTS=1 cleansync:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
      - name: Health, login and security headers
        run: |
          curl -fsS http://localhost:8080/api/health | grep -q app_name
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-password"}' | grep -q must_change_password
          curl -fsSI http://localhost:8080/drive | grep -i "content-security-policy: default-src 'self'"
      - name: Add local pretend Google accounts
        # bob has nothing synced: a second pretend account, used by the New menu tests.
        run: |
          docker exec -e DRIVESYNC_ALLOW_LOCAL_ACCOUNTS=1 cs python -m app.devtools.seed_local_account alice@example.com --sample-files --sample-mail
          docker exec -e DRIVESYNC_ALLOW_LOCAL_ACCOUNTS=1 cs python -m app.devtools.seed_local_account bob@example.com
      - name: Start the pretend model
        # For the rules browser test: CleanSync's server calls it at http://127.0.0.1:11999/v1.
        run: |
          docker exec -d cs python -m app.devtools.fake_model --port 11999
          for i in $(seq 1 30); do docker exec cs python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11999/v1/models')" && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser smoke test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: ci-smoke-password
          E2E_CONTAINER: cs
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - if: failure()
        run: docker logs cs

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
