[project]
name = "drivesync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "watchdog>=4.0",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "pillow>=11",
  "nh3>=0.3.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    { include-group = "templates" },
]
templates = [
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["realrclone: needs a real rclone binary on PATH"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E402"]
