services:
  cleansync:
    image: ghcr.io/argoyal/cleansync:latest
    # Check for a newer "latest" image every time the container is (re)created.
    pull_policy: always
    user: "1000:1000"
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      # One folder holds everything: app/data (state) and storage/<email> (your files).
      - /srv/drivesync:/drivesync
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
